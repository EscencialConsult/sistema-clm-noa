server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html SIEMPRE se revalida — es la que apunta a los archivos con
  # hash del build actual. Cachearla es lo que causaba el bug real de esta
  # tarde: el navegador servía un index.html viejo apuntando a JS/CSS/webp
  # con hash que ya no existían tras el redeploy siguiente (404 silencioso
  # -> imagen rota, fondo sin cargar, versión de código vieja corriendo).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Los assets sí llevan hash en el nombre (Vite) — si cambian, cambia el
  # nombre del archivo. Podés cachearlos "para siempre" sin riesgo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
