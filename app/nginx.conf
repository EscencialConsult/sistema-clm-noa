server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html SIEMPRE se revalida — es la que apunta a los archivos con
  # hash del build actual. Cachearla es lo que causaba el bug real de esta
  # tarde: el navegador servía un index.html viejo apuntando a JS/CSS/webp
  # con hash que ya no existían tras el redeploy siguiente (404 silencioso
  # -> imagen rota, fondo sin cargar, versión de código vieja corriendo).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Los assets sí llevan hash en el nombre (Vite) — si cambian, cambia el
  # nombre del archivo. Podés cachearlos "para siempre" sin riesgo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # La API por el mismo origen que la pantalla.
  #
  # En la clínica el navegador va directo a kong:8000 y esto no se usa.
  # Sirve para cuando hay UN solo punto de entrada — un túnel para
  # mostrarlo de afuera, o un dominio con HTTPS — donde no se puede
  # abrir un segundo puerto.
  #
  # Kong ya resuelve autenticación y CORS; acá no se decide nada.
  location ~ ^/(auth|rest|storage)/v1/ {
    proxy_pass http://kong:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
