    <!-- La tipografía vive en el servidor, no en Google.

         En la clínica el servidor puede quedar sin salida a internet, y el
         instructivo promete que no le hace falta. Pidiéndosela a Google
         pasaban dos cosas: la pantalla salía con otra letra —distinta de la
         que vieron en la demostración— y cada carga esperaba a que el
         pedido fallara.

         Inter se distribuye como fuente variable: un solo archivo por
         subconjunto cubre los cuatro grosores, moviendo el eje «wght». Por
         eso son dos archivos y no ocho, y por eso el rango 100 900. -->
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fuentes/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fuentes/inter-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
    </style>
