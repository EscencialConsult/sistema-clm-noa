# =====================================================================
#  CML NOA · Prelaboral — servidor de la clínica
#
#  Supabase AUTOALOJADO: corre entero adentro del consultorio, sobre la
#  red local. No es el servicio en la nube. Es código abierto, no valida
#  licencia contra internet y funciona con el cable del router
#  desenchufado (RNF-06).
#
#  Todo escucha en 127.0.0.1 salvo kong y app: el resto de los servicios
#  no tiene por qué ser alcanzable desde la red, ni siquiera la interna.
#
#  Levantar:   docker compose up -d
#  Ver estado: docker compose ps
#  Procedimiento para cuando algo se cae: 08_Procedimientos, P-03.
# =====================================================================

name: cmlnoa

services:

  # ---------- la base ----------
  db:
    image: supabase/postgres:15.8.1.060
    container_name: cmlnoa-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"        # solo desde el propio servidor
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
      # La hora de la clínica, no UTC. La zona de la BASE la fija la
      # migración 012 (ALTER DATABASE); esto alinea al contenedor, para
      # que los logs y el backup nocturno hablen de la misma noche.
      TZ: ${TZ:-America/Argentina/Tucuman}
      PGTZ: ${TZ:-America/Argentina/Tucuman}
    volumes:
      - db-data:/var/lib/postgresql/data
      # zz- para que corra DESPUÉS de migrate.sh, el script propio de la imagen
      # que crea el esquema auth. Postgres los ejecuta por orden alfabético y
      # "99" viene antes que "m": con ese nombre, auth.uid() todavía no existe.
      # Y va como .sh porque Postgres no entra en subcarpetas: este recorre migrations/.
      - ./supabase/aplicar-migraciones.sh:/docker-entrypoint-initdb.d/zz-cmlnoa.sh:ro
      # a una ruta PROPIA: /docker-entrypoint-initdb.d/migrations es la carpeta
      # de la imagen — montar ahí tapa las suyas (y sin ellas no existe auth)
      - ./supabase/migrations:/cmlnoa/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- autenticación ----------
  auth:
    image: supabase/gotrue:v2.170.0
    container_name: cmlnoa-auth
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      API_EXTERNAL_URL: ${SITE_URL}:${KONG_PUERTO_PUBLICO:-8000}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # nadie se registra solo: los usuarios los da de alta el Administrador (RF01)
      # El mínimo de fábrica es 6: alguien podía dejar «123456» sobre una
      # base de historias clínicas. Se sube a 8, que es lo que ya exige
      # crear_usuario_completo(); las que genera el sistema tienen 13.
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  # ---------- la API que se genera desde las tablas ----------
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: cmlnoa-rest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      # Sin sesión se podía leer el esquema entero: las 21 tablas con todas
      # sus columnas. No hay datos ahí, pero sí el modelo completo de un
      # sistema clínico, servido a cualquiera que tenga la clave pública
      # — que es la que viaja al navegador.
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # ---------- archivos: informes externos y declaraciones escaneadas ----------
  storage:
    image: supabase/storage-api:v1.14.5
    container_name: cmlnoa-storage
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 20971520        # 20 MB por informe (RNF-22)
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: cmlnoa
      REGION: local
      GLOBAL_S3_BUCKET: cmlnoa
    volumes:
      - storage-data:/var/lib/storage

  # ---------- la puerta única: todo entra por acá ----------
  kong:
    image: kong:2.8.1
    container_name: cmlnoa-kong
    restart: unless-stopped
    depends_on: [auth, rest, storage]
    ports:
      # 8000 por defecto (servidor dedicado de la clínica). En una máquina
      # compartida con otros proyectos, override en .env: KONG_PUERTO_PUBLICO=8090
      - "${KONG_PUERTO_PUBLICO:-8000}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    # Kong no sustituye variables en su configuración por su cuenta: se monta
    # como plantilla y el entrypoint la expande antes de arrancar.
    entrypoint: bash -c 'eval "echo \"$$(cat ~/plantilla.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    volumes:
      - ./supabase/kong.yml:/home/kong/plantilla.yml:ro

  # ---------- las pantallas ----------
  app:
    build:
      context: ./app
      args:
        # La URL con la que van a entrar los puestos, NO localhost.
        VITE_SUPABASE_URL: ${SITE_URL}:${KONG_PUERTO_PUBLICO:-8000}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    container_name: cmlnoa-app
    restart: unless-stopped
    depends_on: [kong]
    ports:
      # 80 por defecto (servidor dedicado). En máquina compartida, override
      # en .env: APP_PUERTO_PUBLICO=8082 (mismo puerto que ya tenía kaplan-front)
      - "${APP_PUERTO_PUBLICO:-80}:80"

volumes:
  db-data:
  storage-data:
